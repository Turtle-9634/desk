<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.github.com; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; manifest-src 'self'; worker-src 'self';">
<title>知予工作台</title>
<meta name="theme-color" content="#f8f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f8f5fb; --card:#ffffff;
  --line:rgba(109,79,156,.14); --line2:rgba(36,28,46,.07);
  --ink:#241c2e; --sub:#7d7590; --dim:#a9a0b8;
  --gold:#9a7735; --gold2:#7d5d22; --gold-soft:#f8f2e6;
  --purple:#6d4f9c; --purple-soft:#f2edf8;
  --danger:#b3392c;
  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain; overflow-x:hidden; max-width:100vw;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
input,textarea,select{font:inherit;color:inherit;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=date]{-webkit-appearance:none;appearance:none;}

/* 顶栏 */
#topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:calc(11px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(248,245,251,.93);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tb-left{flex:1;min-width:0;display:flex;align-items:center;}
.tb-date{font-size:17px;font-weight:500;letter-spacing:.2px;line-height:1.2;}
.tb-date small{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px;letter-spacing:1px;}
.back{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--sub);padding:4px 6px 4px 0;flex:none;}
.back .ar{font-size:15px;line-height:1;margin-top:-1px;}
.tb-t{font-size:16px;font-weight:500;margin-left:10px;letter-spacing:1.4px;}
#syncBtn{
  display:flex;align-items:center;gap:5px;flex:none;
  font-size:11px;color:var(--sub);padding:5px 9px;border-radius:20px;
  background:#fff;border:1px solid var(--line);white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none;}
.dot.ok{background:var(--gold);} .dot.warn{background:#c08a3e;} .dot.err{background:var(--danger);}
#syncBtn.saving .dot{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#syncTxt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}

/* 通用 */
.wrap{padding:14px 16px 6px;max-width:720px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.lab{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:500;}
.hint{font-size:11px;color:var(--dim);letter-spacing:.3px;}
.muted{color:var(--sub);font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.grow{flex:1;min-width:0;}
.hide{display:none !important;}
.nums{font-variant-numeric:tabular-nums;}

/* 首页 · 到账 */
.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px 18px 14px;margin-bottom:10px;}
.hero-num{display:flex;align-items:baseline;gap:4px;margin:9px 0 15px;}
.hero-num .cur{font-size:15px;color:var(--gold);}
.hero-num .v{font-size:40px;font-weight:500;letter-spacing:-1.6px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums;}
.hero-grid{display:flex;border-top:1px solid var(--line2);padding-top:12px;}
.hg{flex:1;min-width:0;padding:0 12px;}
.hg:first-child{padding-left:0;}
.hg:last-child{padding-right:0;}
.hg + .hg{border-left:1px solid var(--line2);}
.hg-l{font-size:11px;color:var(--dim);margin-bottom:4px;}
.hg-in{display:flex;align-items:baseline;gap:2px;}
.hg-in input{
  flex:1 1 0; width:0; min-width:0; border:none; background:none;
  font-size:16px; font-weight:500; padding:0 0 3px; outline:none;
  border-bottom:1px solid rgba(154,119,53,.45);
  font-variant-numeric:tabular-nums; border-radius:0;
}
.hg-in input::placeholder{color:var(--dim);font-weight:400;}
.hg-val{font-size:16px;font-weight:500;padding-bottom:3px;border-bottom:1px solid var(--line2);color:var(--gold2);font-variant-numeric:tabular-nums;}
.hg-val.zero{color:var(--dim);}

/* 首页 · 档期提示 */
.ribbon{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:11px 14px;margin-bottom:10px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
}
.ribbon .dia{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex:none;}
.ribbon .rb-t{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ribbon .rb-v{font-size:13px;color:var(--gold2);font-variant-numeric:tabular-nums;flex:none;}

/* 任务 */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;}
.task:last-child{border-bottom:none;padding-bottom:2px;}
.task:first-of-type{padding-top:4px;}
.tick{
  width:20px;height:20px;border-radius:50%;border:1px solid rgba(154,119,53,.4);
  flex:none;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.tick svg{display:block;}
.task.on .tick{background:var(--gold);border-color:var(--gold);}
.task.on .t-n{color:var(--dim);text-decoration:line-through;}
.t-n{font-size:15px;}

/* 账号节奏 */
.acct{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);}
.acct:last-child{border-bottom:none;padding-bottom:0;}
.acct .acc-n{font-size:14.5px;flex:none;}
.acct .hint{flex:1;min-width:0;}
.btn-s{font-size:11.5px;padding:4px 11px;border-radius:9px;border:1px solid var(--line);color:var(--sub);flex:none;background:#fcfaff;}
.btn-s.on{color:var(--gold2);border-color:rgba(154,119,53,.4);background:var(--gold-soft);}

/* 首页 · 模块宫格 */
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px;}
.mod{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 2px 11px;background:#fff;border:1px solid var(--line);border-radius:15px;
}
.mod-ic{color:var(--gold);display:flex;line-height:0;}
.mod-n{font-size:11.5px;color:var(--sub);letter-spacing:.8px;}
.mod:active{background:#fcfaff;}
.foot{text-align:center;padding:8px 0 18px;}
.foot button{font-size:12px;color:var(--dim);letter-spacing:1px;}

/* 档期 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-title{font-size:15px;font-weight:500;letter-spacing:1px;}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{
  width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fcfaff;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-wd{text-align:center;font-size:11px;color:var(--dim);padding:2px 0 6px;}
.cal-d{
  aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:13.5px;position:relative;cursor:pointer;
  color:var(--ink);
}
.cal-d.out{color:transparent;}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold2);font-weight:500;}
.cal-d.has{background:var(--gold-soft);color:var(--gold2);font-weight:500;}
.cal-d .amt{font-size:9px;line-height:1;margin-top:1px;color:var(--gold);font-weight:400;letter-spacing:-.2px;}
.cal-d:active{background:var(--purple-soft);}

.bk{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:center;}
.bk:last-child{border-bottom:none;padding-bottom:0;}
.bk-date{flex:none;width:42px;text-align:center;font-size:10.5px;color:var(--dim);line-height:1.3;}
.bk-date b{display:block;font-size:16px;color:var(--ink);font-weight:500;}
.bk-main{flex:1;min-width:0;}
.bk-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-sub{font-size:11.5px;color:var(--dim);margin-top:2px;}
.bk-fee{font-size:14.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;}

/* 列表 / 待办 */
.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);}
.todo:last-of-type{border-bottom:none;padding-bottom:0;}
.todo .tick{width:18px;height:18px;margin-top:2px;}
.todo.on .tick{background:var(--gold);border-color:var(--gold);}
.todo.on .t-text{color:var(--dim);text-decoration:line-through;}
.t-text{flex:1;font-size:14.5px;line-height:1.5;word-break:break-word;}
.del{color:var(--dim);font-size:16px;padding:0 3px;line-height:1.2;flex:none;}
.addbar{display:flex;gap:8px;margin-top:14px;}
.addbar input{
  flex:1;min-width:0;border:1px solid var(--line);background:#fcfaff;border-radius:11px;
  padding:10px 12px;font-size:15px;outline:none;
}
.addbar input:focus{border-color:rgba(154,119,53,.55);background:#fff;}
.addbar button{padding:0 16px;border-radius:11px;background:var(--gold);color:#fff;font-size:14px;font-weight:500;}

/* 自媒体 */
.big{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
.big b{font-size:26px;font-weight:500;color:var(--gold2);letter-spacing:-.8px;font-variant-numeric:tabular-nums;}
.big span{font-size:12px;color:var(--sub);}
.sub-line{font-size:11.5px;color:var(--dim);letter-spacing:.5px;margin-bottom:13px;}
.rev-entry{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:13px 15px;margin-bottom:12px;
  background:#fff;border:1px solid rgba(154,119,53,.3);border-radius:var(--r);
}
.rev-entry .re-ic{color:var(--gold);line-height:0;flex:none;}
.rev-entry .re-t{flex:1;min-width:0;}
.rev-entry .re-t b{display:block;font-size:13.5px;font-weight:500;color:var(--ink);}
.rev-entry .re-t span{display:block;font-size:11px;color:var(--dim);margin-top:2px;}
.rev-entry .ar{color:var(--gold);font-size:14px;}
.acc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 15px 11px;margin-bottom:8px;}
.acc-h{display:flex;align-items:center;gap:8px;}
.acc-n{font-size:14.5px;font-weight:500;flex:1;min-width:0;}
.acc-c{font-size:11px;color:var(--dim);}
.pl-row{display:flex;align-items:center;gap:14px;padding:9px 0 0;flex-wrap:wrap;}
.pl-unit{display:flex;align-items:center;gap:6px;}
.plat-t{font-size:11px;padding:2px 8px;border:1px solid var(--line2);border-radius:7px;color:var(--sub);background:#fcfaff;}
.st{font-size:11px;padding:2px 8px;border-radius:20px;}
.pl-dorm{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);}
.pl-dorm:last-child{border-bottom:none;}
.st.active{color:var(--gold2);border:1px solid rgba(154,119,53,.34);background:var(--gold-soft);}
.st.paused{color:var(--dim);border:1px solid var(--line2);}
.st.planned{color:var(--purple);border:1px solid rgba(109,79,156,.22);background:var(--purple-soft);}
.pos{font-size:11.5px;color:var(--dim);margin-top:8px;letter-spacing:.3px;}
.planned-card{border:1px dashed rgba(109,79,156,.22);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--sub);line-height:1.8;}

/* 复盘 */
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.wk-l{font-size:12px;color:var(--sub);padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;flex:none;}
.wk-m{text-align:center;font-size:13.5px;font-weight:500;line-height:1.3;}
.wk-m small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:1px;letter-spacing:.5px;}
.rv-acc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);}
.rv-acc:last-child{border-bottom:none;padding-bottom:0;}
.rv-n{flex:1;font-size:13.5px;}
.rv-c{font-size:13px;color:var(--gold2);font-variant-numeric:tabular-nums;flex:none;}
.dots{display:flex;gap:4px;margin-top:9px;}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line2);display:block;}
.dots i.on{background:var(--gold);}
.ai-note{background:var(--purple-soft);border-radius:12px;padding:13px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:#3d2f55;margin-bottom:10px;}
textarea.rv{
  width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;
  background:#fcfaff;padding:11px 12px;font-size:15px;line-height:1.6;outline:none;resize:vertical;
}
textarea.rv:focus{border-color:rgba(154,119,53,.5);background:#fff;}

/* 收入 */
.day-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);width:100%;}
.day-row:last-of-type{border-bottom:none;padding-bottom:0;}
.dr-date{flex:none;width:46px;font-size:10.5px;color:var(--dim);line-height:1.3;text-align:center;}
.dr-date b{display:block;font-size:15px;color:var(--ink);font-weight:500;}
.dr-mid{flex:1;min-width:0;font-size:11.5px;color:var(--dim);line-height:1.5;}
.dr-mid em{font-style:normal;color:var(--sub);}
.dr-amt{font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;flex:none;}

/* 空状态 */
.empty{text-align:center;padding:24px 10px;color:var(--dim);font-size:12.5px;line-height:1.8;}

/* 弹层 */
#mask{position:fixed;inset:0;background:rgba(36,28,46,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
#mask.on{opacity:1;pointer-events:auto;}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:#fff;border-radius:22px 22px 0 0;
  padding:6px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
#sheet.on{transform:translateY(0);}
.sheet-bar{width:34px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 15px;}
.sheet-t{font-size:16px;font-weight:500;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.5px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:1.5px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:#fcfaff;border-radius:11px;
  padding:11px 12px;font-size:16px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(154,119,53,.5);background:#fff;}
.field .hint{margin-top:6px;line-height:1.6;}
.btn-full{width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#fff;font-size:15px;font-weight:500;margin-top:6px;text-align:center;}
.btn-full.ghost{background:#fcfaff;color:var(--ink);border:1px solid var(--line);}
.btn-full.danger{background:#fdf2f0;color:var(--danger);}
.ro-val{font-size:16px;padding:11px 12px;border:1px solid var(--line2);border-radius:11px;background:#f9f7fc;color:var(--gold2);font-variant-numeric:tabular-nums;}

/* 引导 */
#welcome{padding:22px 4px 10px;}
#welcome h1{font-size:21px;margin:0 0 8px;font-weight:500;letter-spacing:1px;}
#welcome .lead{font-size:13.5px;color:var(--sub);line-height:1.9;margin-bottom:24px;}
.step{display:flex;gap:12px;margin-bottom:18px;}
.step-n{
  width:20px;height:20px;border-radius:50%;border:1px solid rgba(154,119,53,.4);color:var(--gold2);
  font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;
}
.step-b{font-size:13.5px;line-height:1.75;color:var(--sub);}
.step-b b{font-weight:500;color:var(--ink);}
code{background:var(--purple-soft);padding:1px 5px;border-radius:4px;font-size:12px;font-family:ui-monospace,Menlo,monospace;}
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left" id="tbLeft"></div>
  <button id="syncBtn"><span class="dot"></span><span id="syncTxt">启动中</span></button>
</header>

<main id="pages">
  <div id="page-home"     class="page"></div>
  <div id="page-schedule" class="page hide"></div>
  <div id="page-pr"       class="page hide"></div>
  <div id="page-media"    class="page hide"></div>
  <div id="page-review"   class="page hide"></div>
  <div id="page-income"   class="page hide"></div>
</main>

<div id="mask"></div>
<div id="sheet"><div class="sheet-bar"></div><div id="sheetBody"></div></div>

<script>
(function(){
'use strict';

/* =========================================================
   1. 常量与工具
   ========================================================= */
const LS_CFG = 'desk.cfg.v1';

];

const ACCOUNT_SEED = [
  { groupId:'pr',      name:'PR 日常号',      positioning:'拍 PR 日常 / 卖 9.9 资料包 / 接广', status:'planned' },
  { groupId:'ai',      name:'AI 资料包号',    positioning:'教别人用 AI',                     status:'planned' },
  { groupId:'tarot',   name:'塔罗号',         positioning:'塔罗',                            status:'planned' },
  { groupId:'english', name:'英语号',         positioning:'英语',                            status:'planned' },
  { groupId:'face',    name:'颜值图文号',     positioning:'图文',                            status:'planned' },
  { groupId:'zhiyu',   name:'知予',           positioning:'主持现场 / 干货 / 英语打卡',      status:'active'  },
  { groupId:'turtle',  name:'飞翔的乌龟',     positioning:'手势舞 / 接广',                   status:'active'  },
  { groupId:'school',  name:'教务系统销售号', positioning:'朋友教务系统',                    status:'planned' }
];

const STATUS_LABEL = { active:'在更', paused:'停更', planned:'待开' };

const TICK = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.4 L3.7 8 L9 2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const ICON = {

/* --- 东八区日期 --- */
const DTF = new Intl.DateTimeFormat('en-CA', {
  timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit'
});
function todayKey(){ return DTF.format(new Date()); }

function shiftDay(key, n){
  const [y,m,d] = key.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1, d) + n*86400000);
  return t.toISOString().slice(0,10);
}
function dayDiff(a, b){
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000);
}
function weekdayName(key){
  const [y,m,d] = key.split('-').map(Number);
  return ['周日','周一','周二','周三','周四','周五','周六'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
}
function prettyDate(key){
  const [,m,d] = key.split('-').map(Number);
  return m + '月' + d + '日';
}
function pad2(n){ return String(n).padStart(2,'0'); }

/* --- ISO 周 --- */
function weekKeyOf(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  const dow = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dow);
  const isoYear = dt.getUTCFullYear();
  const jan1 = new Date(Date.UTC(isoYear, 0, 1));
  const week = Math.ceil(((dt - jan1) / 86400000 + 1) / 7);
  return isoYear + '-W' + String(week).padStart(2,'0');
}
function mondayOf(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  const dow = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() - (dow - 1));
  return dt.toISOString().slice(0,10);
}
function weekRange(monday){ return [monday, shiftDay(monday, 6)]; }
function shiftWeek(monday, n){ return shiftDay(monday, n*7); }
function weekLabel(monday){
  const a = weekRange(monday);
  return prettyDate(a[0]) + ' – ' + prettyDate(a[1]);
}

/* --- 杂项 --- */
function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v){ const n = parseInt(v, 10); return isFinite(n) ? n : 0; }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function money(n){
  if (!n) return '0';
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function hhmm(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* --- base64（UTF-8 安全） --- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* =========================================================
   3. 合并（字段级 LWW + 墓碑）
   ========================================================= */
function mergeById(a, b){
  const map = new Map();
  (a || []).forEach(x => { if (x && x.id) map.set(x.id, x); });
  (b || []).forEach(x => {
    if (!x || !x.id) return;
    const cur = map.get(x.id);
    if (!cur || (x.updatedAt || 0) >= (cur.updatedAt || 0)) map.set(x.id, x);
  });
  return Array.from(map.values());
}
function mergeDays(a, b){
  const out = {};
  const keys = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
  keys.forEach(k => {
    const x = (a || {})[k], y = (b || {})[k];
    if (!x) { out[k] = y; return; }
    if (!y) { out[k] = x; return; }
    const xt = x.tasksAt || 0, yt = y.tasksAt || 0;
    const xi = x.incomeAt || 0, yi = y.incomeAt || 0;
    out[k] = {
      tasks:    xt >= yt ? x.tasks    : y.tasks,
      tasksAt:  Math.max(xt, yt),
      income:   xi >= yi ? x.income   : y.income,
      incomeAt: Math.max(xi, yi),
      note:     xi >= yi ? (x.note || '') : (y.note || '')
    };
  });
  return out;
}
function mergeReviews(a, b){
  const out = {};
  const keys = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
  keys.forEach(k => {
    const x = (a || {})[k], y = (b || {})[k];
    if (!x) { out[k] = y; return; }
    if (!y) { out[k] = x; return; }
    out[k] = (x.updatedAt || 0) >= (y.updatedAt || 0) ? x : y;
  });
  return out;
}
function mergeData(a, b){
  const A = a || {}, B = b || {};
  return {
    schemaVersion: 1,
    updatedAt: Math.max(A.updatedAt || 0, B.updatedAt || 0),
    days: mergeDays(A.days, B.days),
    bookings: mergeById(A.bookings, B.bookings),
    prTodos: mergeById(A.prTodos, B.prTodos),
    contentLog: mergeById(A.contentLog, B.contentLog),
    accounts: mergeById(A.accounts, B.accounts),
    reviews: mergeReviews(A.reviews, B.reviews)
  };
}

/* =========================================================
   4. GitHub API
   ========================================================= */
function apiURL(){
  return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path;
}
function headers(withBody){
  const h = {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json'
  };
  if (withBody) h['Content-Type'] = 'application/json';
  return h;
}
async function ghGet(){
  const r = await fetch(apiURL() + '?t=' + Date.now(), {
    headers: headers(false), cache: 'no-store', credentials: 'omit'
  });
  if (r.status === 404) return { sha:null, data:null };
  if (r.status === 401) throw mkErr('AUTH', '令牌无效或已过期');
  if (r.status === 403) {
    const rem = r.headers.get('x-ratelimit-remaining');
    if (rem === '0') throw mkErr('RATE', 'GitHub 限流，稍后再试');
    throw mkErr('AUTH', '没有权限读取该仓库');
  }
  if (!r.ok) throw mkErr('HTTP', '读取失败（' + r.status + '）');
  const j = await r.json();
  const text = b64dec(String(j.content || '').replace(/\s/g, ''));
  let parsed = null;
  try { parsed = JSON.parse(text); } catch(e){ parsed = null; }
  return { sha: j.sha, data: parsed };
}
async function ghPut(payload, baseSha, message){
  const body = { message: message, content: b64enc(JSON.stringify(payload, null, 2)) };
  if (baseSha) body.sha = baseSha;
  const r = await fetch(apiURL(), {
    method:'PUT', headers: headers(true), body: JSON.stringify(body), credentials:'omit'
  });
  if (r.status === 409 || r.status === 422) throw mkErr('CONFLICT', '另一台设备刚改过');
  if (r.status === 401) throw mkErr('AUTH', '令牌无效或已过期');
  if (r.status === 403) {
    const rem = r.headers.get('x-ratelimit-remaining');
    if (rem === '0') throw mkErr('RATE', 'GitHub 限流，稍后再试');
    throw mkErr('AUTH', '没有写入权限');
  }
  if (!r.ok) throw mkErr('HTTP', '保存失败（' + r.status + '）');
  const j = await r.json();
  return j.content && j.content.sha ? j.content.sha : null;
}
function mkErr(code, msg){ const e = new Error(msg); e.code = code; return e; }

/* =========================================================
   5. 同步
   ========================================================= */
let saveTimer = null;

function persistDirty(v){
  try { localStorage.setItem(LS_DIRTY, v ? '1' : '0'); } catch(e){}
}
function touch(){
  dirty = true;
  persistDirty(true);
  saveLocal();
  renderSync();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { syncNow(); }, 1200);
}
function markDirtyOnly(){ touch(); }

function syncDone(){
  syncState = 'ok';
  lastSync = Date.now();
  syncMsg = '已同步 ' + hhmm(lastSync);
  try { localStorage.setItem(LS_SYNC, String(lastSync)); } catch(e){}
  safeRerender();
}
function safeRerender(){
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) {
    renderSync();
    return;
  }
  rerender();
}

async function syncNow(){
  if (!cfg.token) {
    syncState = 'local'; syncMsg = '仅存本机';
    renderSync();
    return;
  }
  if (syncing) { pendingSync = true; return; }
  syncing = true;
  syncState = 'saving'; syncMsg = '同步中'; renderSync();

  let attempt = 0;
  const maxTry = 3;

  while (attempt < maxTry) {
    attempt++;
    try {
      const remote = await ghGet();
      const remoteData = remote.data || emptyData();
      const merged = mergeData(data, remoteData);
      const isNew = remote.sha === null;

      let needPush = isNew || dirty;
      if (needPush && remote.data &&
          JSON.stringify(stripTs(merged)) === JSON.stringify(stripTs(remoteData))) {
        needPush = false;
      }

      if (!needPush) {
        data = merged;
        sha = remote.sha;
        dirty = false;
        persistDirty(false);
        saveLocal();
        syncDone();
        break;
      }

      const newSha = await ghPut(merged, remote.sha, 'data: ' + todayKey() + ' 更新');
      data = merged;
      sha = newSha || remote.sha;
      dirty = false;
      persistDirty(false);
      saveLocal();
      syncDone();
      break;

    } catch(err) {
      if (err.code === 'CONFLICT' && attempt < maxTry) {
        await sleep(300 * attempt + Math.random() * 200);
        continue;
      }
      if (err.code === 'RATE' && attempt < maxTry) {
        await sleep(4000);
        continue;
      }
      syncState = 'error';
      syncMsg = err.message || '同步失败';
      break;
    }
  }

  syncing = false;
  renderSync();
  if (pendingSync) { pendingSync = false; syncNow(); }
}
function stripTs(d){
  return { days:d.days, bookings:d.bookings, prTodos:d.prTodos,
           contentLog:d.contentLog, accounts:d.accounts, reviews:d.reviews };
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function dayOf(key, create){
  if (!data.days[key] && create) {

      tasksAt:0,
      income:{ pr:0, other:0 },

    };

}
function bookingsOn(key){

function dayOther(key){ const d = data.days[key]; return d ? num(d.income.other) : 0; }
function dayTotal(key){

function lastUpdateOf(acct){

    if (c.date > max) max = c.date;

}
function updatedToday(acct){

}

    .filter(b => !b.deleted && b.date && b.date.slice(0,7) === ym)
    .sort((a,b) => a.date < b.date ? -1 : 1);

  const monthSum = monthList.reduce((s,b) => s + num(b.fee), 0);

  let h = '<div class="wrap">';

  for (let dd = 1; dd <= daysInMonth; dd++) {
    const key = ym + '-' + pad2(dd);
    let cls = 'cal-d';
    if (key === k) cls += ' today';
    if (byDate[key]) cls += ' has';
    h += '<div class="' + cls + '" data-act="pickday" data-d="' + key + '">';
    h += '<span>' + dd + '</span>';
    if (byDate[key]) h += '<span class="amt">' + money(byDate[key]) + '</span>';
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="hero-grid" style="margin-top:13px;">';
  h += '<div class="hg"><div class="hg-l">本月场次</div><div class="hg-val" style="color:var(--ink)">' + monthList.length + '</div></div>';
  h += '<div class="hg"><div class="hg-l">本月合计</div><div class="hg-val">' + money(monthSum) + '</div></div>';
  h += '<div class="hg"><div class="hg-l">待结</div><div class="hg-val' + (unpaid ? '' : ' zero') + '">' + money(unpaid) + '</div></div>';
  h += '</div>';
  h += '</div>';

  h += '<div class="card">';
  h += '<div class="card-h"><span class="lab">本月档期</span><button class="cal-nav" data-act="pickday" data-d="' + k + '" style="font-size:12px;color:var(--gold2);border:none;background:none;width:auto;height:auto;padding:0;">+ 加一场</button></div>';
  if (!monthList.length) {
    h += '<div class="empty">本月还没有档期<br>点日历上任意一天开始记</div>';
  } else {
    monthList.forEach(b => {
      h += '<div class="bk" data-act="editbk" data-id="' + b.id + '">';
      h += '<div class="bk-date"><b>' + Number(b.date.slice(8,10)) + '</b>' + weekdayName(b.date) + '</div>';
      h += '<div class="bk-main"><div class="bk-title">' + esc(b.venue || '未填场地') + '</div>';
      h += '<div class="bk-sub">' + esc(b.type || '主持') + ' · ' + (b.paid ? '已结' : '未结') + '</div></div>';
      h += '<div class="bk-fee" style="color:' + (b.paid ? 'var(--dim)' : 'var(--ink)') + '">' + money(b.fee) + '</div>';
      h += '</div>';
    });
  }
  h += '</div></div>';

  $('page-schedule').innerHTML = h;
}

function renderMedia(){
  const groups = {};
  data.accounts.forEach(a => {
    if (a.deleted) return;
    if (!groups[a.groupId]) groups[a.groupId] = { name:a.name, items:[] };
    groups[a.groupId].items.push(a);
  });
  const order = ACCOUNT_SEED.map(s => s.groupId);
  const keys = Object.keys(groups).sort((x,y) => order.indexOf(x) - order.indexOf(y));

  const activeGroups = keys.filter(gid => groups[gid].items.some(a => a.status === 'active'));
  const dormant = keys.filter(gid => !groups[gid].items.some(a => a.status === 'active'));

  const k = todayKey();
  const mon = mondayOf(k);
  const wkDays = [];
  for (let i = 0; i < 7; i++) wkDays.push(shiftDay(mon, i));
  let weekCount = 0;
  data.contentLog.forEach(c => {
    if (c.deleted) return;
    if (c.date < wkDays[0] || c.date > wkDays[6]) return;
    if (!TRACK_ACCTS.some(t => t.k === c.account)) return;
    weekCount++;
  });
  const wk = weekKeyOf(mon);
  const rv = data.reviews[wk] || {};

  let h = '<div class="wrap">';

  h += '<div class="big"><b>' + activeGroups.length + '</b><span>个 IP 在更</span></div>';
  h += '<div class="sub-line">8 个 IP · 16 个平台账号 · 抖音 / 小红书</div>';

  h += '<button class="rev-entry" data-act="go" data-to="#/media/review">';
  h += '<span class="re-ic">' + ICON.chart + '</span>';
  h += '<span class="re-t"><b>本周复盘</b><span>更新 ' + weekCount + ' 次 · ' + (rv.aiText ? '已写' : '待盘') + '</span></span>';
  h += '<span class="ar">›</span></button>';

  activeGroups.forEach(gid => {
    const g = groups[gid];
    const g0 = g.items[0];
    h += '<div class="acc">';
    h += '<div class="acc-h"><span class="acc-n">' + esc(g.name) + '</span></div>';
    h += '<div class="pl-row">';
    g.items.sort((a,b) => a.platform < b.platform ? -1 : 1).forEach(a => {
      h += '<span class="pl-unit"><span class="plat-t">' + (PLATFORMS[a.platform] || a.platform) + '</span>';
      h += '<span class="st ' + a.status + '" data-act="stcycle" data-id="' + a.id + '">' +
           (STATUS_LABEL[a.status] || a.status) + '</span></span>';
    });
    h += '</div>';
    if (g0.positioning) h += '<div class="pos">' + esc(g0.positioning) + '</div>';
    h += '</div>';
  });

  if (activeGroups.length) {
    h += '<div class="hint" style="padding:0 2px 12px;">点金色状态标签可切换 在更 / 停更 / 待开</div>';
  }

  if (dormant.length) {
    h += '<div class="card" style="padding:14px 15px;">';
    h += '<div class="lab" style="margin-bottom:6px;">待开账号</div>';
    dormant.forEach(gid => {
      const g = groups[gid];
      h += '<div class="pl-dorm"><span class="grow" style="font-size:13.5px;">' + esc(g.name) + '</span>';
      h += '<span class="acc-c">' + g.items.length + ' 个平台</span>';
      h += '<button class="btn-s" data-act="enable" data-g="' + gid + '">启用</button></div>';
    });

  h += '</div>';
  $('page-media').innerHTML = h;

function renderReview(){
  const k = todayKey();
  if (!view.weekMonday) view.weekMonday = mondayOf(k);
  const mon = view.weekMonday;
  const days = [];
  for (let i = 0; i < 7; i++) days.push(shiftDay(mon, i));

  const per = {};
  TRACK_ACCTS.forEach(a => { per[a.k] = [0,0,0,0,0,0,0]; });
  let totalCount = 0;
  data.contentLog.forEach(c => {
    if (c.deleted) return;
    const i = days.indexOf(c.date);
    if (i < 0) return;
    if (!per[c.account]) return;
    per[c.account][i]++;
    totalCount++;
  });

  const wk = weekKeyOf(mon);
  const isThisWeek = (mon === mondayOf(k));
  const rv = data.reviews[wk] || {};

  let h = '<div class="wrap">';

  h += '<div class="week-nav">';
  h += '<button class="wk-l" data-act="wprev">‹ 上周</button>';
  h += '<div class="wk-m">' + weekLabel(mon) + '<small>' + wk + (isThisWeek ? ' · 本周' : '') + '</small></div>';
  h += '<button class="wk-l" data-act="wnext">下周 ›</button>';
  h += '</div>';

  h += '<div class="card">';
  h += '<div class="card-h"><span class="lab">更新次数</span><span class="hint">合计 ' + totalCount + ' 次</span></div>';
  TRACK_ACCTS.forEach(a => {
    const arr = per[a.k];
    const n = arr.reduce((s,v) => s + v, 0);
    h += '<div class="rv-acc"><span class="rv-n">' + a.n + '</span><span class="rv-c">' + n + ' 次</span></div>';
  });
  h += '<div class="dots">';
  days.forEach((dk, i) => {
    const on = TRACK_ACCTS.some(a => per[a.k][i] > 0);
    h += '<i class="' + (on ? 'on' : '') + '"></i>';
  });
  h += '</div>';
  h += '<div class="hint" style="margin-top:7px;">' + weekdayName(days[0]) + ' → ' + weekdayName(days[6]) + '</div>';
  h += '</div>';

  h += '<div class="card">';
  h += '<div class="card-h"><span class="lab">复盘结论</span><span class="hint">' + (rv.aiText ? 'AI 已写' : '待盘') + '</span></div>';
  if (rv.aiText) {
    h += '<div class="ai-note">' + esc(rv.aiText) + '</div>';
  } else {
    h += '<div class="empty" style="padding:16px 6px;">把本周的作品截图发我<br>盘完我把结论写在这里</div>';
  }
  h += '<textarea class="rv" id="rvNote" placeholder="自己补两句…">' + esc(rv.userNote || '') + '</textarea>';
  h += '</div>';

  h += '</div>';
  $('page-review').innerHTML = h;

  const ta = $('rvNote');
  if (ta) {
    ta.addEventListener('input', () => {
      const w = weekKeyOf(view.weekMonday);
      if (!data.reviews[w]) data.reviews[w] = { aiText:'', userNote:'', updatedAt:0 };
      data.reviews[w].userNote = ta.value;
      data.reviews[w].updatedAt = Date.now();
      markDirtyOnly();
    });
  }
}

function renderIncome(){
  const k = todayKey();
  if (!view.incMonth) view.incMonth = k.slice(0,7);
  const ym = view.incMonth;
  const [y, m] = ym.split('-').map(Number);
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();

  const rows = [];
  let sumPR = 0, sumHost = 0, sumOther = 0;
  for (let dd = 1; dd <= dim; dd++) {
    const dk = ym + '-' + pad2(dd);
    const pr = dayPR(dk), ot = dayOther(dk), hs = hostIncomeOn(dk);
    if (pr + ot + hs <= 0) continue;
    const d = data.days[dk];
    rows.push({ dk, pr, ot, hs, total: pr + ot + hs, note: (d && d.note) || '' });
    sumPR += pr; sumHost += hs; sumOther += ot;
  }
  rows.sort((a,b) => a.dk < b.dk ? 1 : -1);
  const sum = sumPR + sumHost + sumOther;

  let h = '<div class="wrap">';

  h += '<div class="card">';
  h += '<div class="card-h"><span class="lab">' + y + ' 年 ' + m + ' 月</span>';
  h += '<div class="cal-nav"><button data-act="iprev">‹</button><button data-act="inext">›</button></div></div>';
  h += '<div class="hero-num"><span class="cur">¥</span><span class="v">' + money(sum) + '</span></div>';
  h += '<div class="hero-grid">';
  h += '<div class="hg"><div class="hg-l">PR</div><div class="hg-val' + (sumPR ? '' : ' zero') + '">' + money(sumPR) + '</div></div>';
  h += '<div class="hg"><div class="hg-l">主持</div><div class="hg-val' + (sumHost ? '' : ' zero') + '">' + money(sumHost) + '</div></div>';
  h += '<div class="hg"><div class="hg-l">其他</div><div class="hg-val' + (sumOther ? '' : ' zero') + '">' + money(sumOther) + '</div></div>';
  h += '</div></div>';

  h += '<div class="card">';
  h += '<div class="card-h"><span class="lab">按天</span>';
  h += '<button data-act="dayAdd" style="font-size:12px;color:var(--gold2);">+ 记一天</button></div>';

  if (!rows.length) {
    h += '<div class="empty">这个月还没有到账记录<br>收到钱就记一笔</div>';
  } else {
    rows.forEach(r => {
      h += '<button class="day-row" data-act="dayEdit" data-d="' + r.dk + '">';
      h += '<span class="dr-date"><b>' + Number(r.dk.slice(8,10)) + '</b>' + weekdayName(r.dk) + '</span>';
      h += '<span class="dr-mid">';
      const bits = [];
      if (r.pr) bits.push('PR ' + money(r.pr));
      if (r.hs) bits.push('主持 ' + money(r.hs));
      if (r.ot) bits.push('其他 ' + money(r.ot));
      h += bits.join(' · ');
      if (r.note) h += '<br><em>' + esc(r.note) + '</em>';
      h += '</span>';
      h += '<span class="dr-amt">' + money(r.total) + '</span>';
      h += '</button>';
    });
  }
  h += '</div>';

  h += '<div class="card"><div class="muted" style="line-height:1.9;font-size:12.5px;">' +
       '这里只记真到账的钱，按天汇总。哪一笔来自谁，在腾讯文档那张表里看。' +
       '主持的钱自动来自档期，不用再填一次。</div></div>';

  h += '</div>';
  $('page-income').innerHTML = h;
}

/* =========================================================
   15. 事件
   ========================================================= */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'go': {
      goto(el.dataset.to);
      break;
    }
    case 'back': {
      const r = ROUTES[routeKey()];
      goto(r.back || '#/home');
      break;
    }
    case 'task': {
      const k = todayKey(), key = el.dataset.k;
      const d = dayOf(k, true);
      d.tasks[key] = !d.tasks[key];
      d.tasksAt = Date.now();
      touch();
      renderHome();
      break;
    }
    case 'inc-pr':
    case 'inc-other':
      break;
    case 'upd': {
      const acct = el.dataset.k, k = todayKey();
      const idx = data.contentLog.findIndex(c => !c.deleted && c.account === acct && c.date === k);
      if (idx >= 0) {
        data.contentLog[idx].deleted = true;
        data.contentLog[idx].updatedAt = Date.now();
      } else {
        data.contentLog.push({ id: uid('c'), date: k, account: acct, note: '', updatedAt: Date.now() });
      }
      touch();
      renderHome();
      break;
    }
    case 'mprev':
    case 'mnext': {
      const [y, m] = view.schedMonth.split('-').map(Number);
      const d = new Date(Date.UTC(y, m-1 + (act === 'mnext' ? 1 : -1), 1));
      view.schedMonth = d.toISOString().slice(0,7);
      renderSchedule();
      break;
    }
    case 'iprev':
    case 'inext': {
      const [y, m] = view.incMonth.split('-').map(Number);
      const d = new Date(Date.UTC(y, m-1 + (act === 'inext' ? 1 : -1), 1));
      view.incMonth = d.toISOString().slice(0,7);
      renderIncome();
      break;
    }
    case 'pickday':
      openBooking(el.dataset.d, '');
      break;
    case 'editbk':
      openBooking('', el.dataset.id);
      break;
    case 'savebk': {
      const dk = el.dataset.d, id = el.dataset.id;
      const venue = ($('bkVenue') || {}).value || '';
      const type  = ($('bkType') || {}).value || '其他';
      const fee   = num(($('bkFee') || {}).value);
      const paid  = ($('bkPaid') || {}).value === '1';
      if (id) {
        const b = data.bookings.find(x => x.id === id);
        if (b) { b.venue = venue; b.type = type; b.fee = fee; b.paid = paid; b.updatedAt = Date.now(); }
      } else {
        data.bookings.push({
          id: uid('b'), date: dk, venue: venue, type: type,
          fee: fee, paid: paid, updatedAt: Date.now()
        });
      }
      closeSheet();
      touch();
      rerender();
      break;
    }
    case 'delbk': {
      const b = data.bookings.find(x => x.id === el.dataset.id);
      if (b) { b.deleted = true; b.updatedAt = Date.now(); }
      closeSheet();
      touch();
      rerender();
      break;
    }
    case 'dayEdit':
      openDayIncome(el.dataset.d, false);
      break;
    case 'dayAdd':
      openDayIncome(todayKey(), true);
      break;
    case 'saveDay': {
      let dk = el.dataset.d;
      if (el.dataset.new === '1') {
        const dv = ($('dyDate') || {}).value;
        if (dv) dk = dv;
      }
      const d = dayOf(dk, true);
      d.income.pr = num(($('dyPR') || {}).value);
      d.income.other = num(($('dyOther') || {}).value);
      d.note = (($('dyNote') || {}).value || '').trim();
      d.incomeAt = Date.now();
      view.incMonth = dk.slice(0,7);
      closeSheet();
      touch();
      rerender();
      break;
    }
    case 'clearDay': {
      const dk = el.dataset.d;
      const d = dayOf(dk, false);
      if (d) {
        d.income = { pr:0, other:0 };
        d.note = '';
        d.incomeAt = Date.now();
      }
      closeSheet();
      touch();
      rerender();
      break;
    }
    case 'pradd': {
      const inp = $('prInput');
      if (inp) addPR(inp.value);
      break;
    }
    case 'prdone': {
      const t = data.prTodos.find(x => x.id === el.dataset.id);
      if (t) { t.done = !t.done; t.updatedAt = Date.now(); touch(); renderPR(); }
      break;
    }
    case 'prdel': {
      const t = data.prTodos.find(x => x.id === el.dataset.id);
      if (t) { t.deleted = true; t.updatedAt = Date.now(); touch(); renderPR(); }
      break;
    }
    case 'stcycle': {
      const a = data.accounts.find(x => x.id === el.dataset.id);
      if (a) {
        const order = ['active','paused','planned'];
        const i = order.indexOf(a.status);
        a.status = order[(i + 1) % 3];
        a.updatedAt = Date.now();
        touch();
        if (routeKey() === 'media') renderMedia(); else rerender();
      }
      break;
    }
    case 'enable': {
      const gid = el.dataset.g;
      let n = 0;
      data.accounts.forEach(a => {
        if (!a.deleted && a.groupId === gid && a.status !== 'active') {
          a.status = 'active'; a.updatedAt = Date.now(); n++;
        }
      });
      if (n) { touch(); renderMedia(); }
      break;
    }
    case 'wprev':
      view.weekMonday = shiftWeek(view.weekMonday, -1);
      renderReview();
      break;
    case 'wnext':
      view.weekMonday = shiftWeek(view.weekMonday, 1);
      renderReview();
      break;
    case 'openSettings':
      openSettings();
      break;
    case 'closeSheet':
      closeSheet();
      break;
    case 'savecfg': {
      cfg.owner = (($('cfOwner') || {}).value || '').trim() || 'Turtle-9634';
      cfg.repo  = (($('cfRepo')  || {}).value || '').trim() || 'El9634';
      cfg.token = (($('cfToken') || {}).value || '').trim();
      cfg.expires = (($('cfExp') || {}).value || '').trim();
      saveCfg();
      closeSheet();
      syncNow();
      break;
    }
    case 'forceSync':
      closeSheet();
      syncNow();
      break;
    case 'cleartoken':
      cfg.token = '';
      saveCfg();
      closeSheet();
      syncState = 'local'; syncMsg = '仅存本机';
      renderSync();
      break;
  }
});

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act !== 'inc-pr' && act !== 'inc-other') return;
  const k = todayKey();
  const d = dayOf(k, true);
  const v = num(el.value);
  if (act === 'inc-pr') d.income.pr = v;
  else d.income.other = v;
  d.incomeAt = Date.now();
  markDirtyOnly();
  const hv = $('heroVal');
  if (hv) hv.textContent = money(dayTotal(k));
});

$('mask').addEventListener('click', closeSheet);

$('syncBtn').addEventListener('click', function(){
  if (syncState === 'local') { openSettings(); return; }
  syncNow();
});

window.addEventListener('hashchange', function(){ applyRoute(true); });

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') {
    if (dirty) { clearTimeout(saveTimer); syncNow(); }
  } else {
    if (cfg.token && Date.now() - lastSync > 60000 && !dirty) syncNow();
  }
});
window.addEventListener('online', function(){ if (dirty) syncNow(); });

/* =========================================================
   16. 启动
   ========================================================= */
function addPR(text){
  const t = String(text || '').trim();
  if (!t) return;
  data.prTodos.push({
    id: uid('t'), date: todayKey(), text: t, done: false, updatedAt: Date.now()
  });
  touch();
  renderPR();
}

function welcomeHTML(){
  let h = '<div class="wrap"><div id="welcome">';
  h += '<h1>知予工作台</h1>';
  h += '<div class="lead">一天只记几个数字和几个勾，其余自动汇总。<br>' +
       '连上你的数据仓库，手机和电脑共用一份。</div>';

  h += '<div class="step"><div class="step-n">1</div><div class="step-b">' +
       '<b>先随便用</b><br>点下面按钮直接开始记。数据存在这台设备里，不会丢。</div></div>';

  h += '<div class="step"><div class="step-n">2</div><div class="step-b">' +
       '<b>想手机电脑同步</b><br>去 GitHub 生成一个令牌，只给 <code>El9634</code> 这一个仓库的读写权限，' +
       '填进「首页 → 设置与同步」。</div></div>';

  h += '<div class="step"><div class="step-n">3</div><div class="step-b">' +
       '<b>加到主屏幕</b><br>浏览器点「分享 → 添加到主屏幕」，以后点开就是全屏。</div></div>';

  h += '<button class="btn-full" data-act="startNow">先开始记</button>';
  h += '</div></div>';
  return h;
}

document.addEventListener('click', function(e){
  if (e.target.closest('[data-act="startNow"]')) {
    welcome = false;
    saveLocal();
    renderHome();
    renderSync();
  }
});

function boot(){
  const raw = String(location.hash || '').replace(/^#\/?/, '').replace(/\/$/, '');
  const known = (raw === 'media/review') || !!ROUTES[raw];
  if (!known) {
    try { history.replaceState(null, '', '#/home'); } catch(e){ location.hash = '#/home'; }
  }

  if (!cfg.token) { syncState = 'local'; syncMsg = '仅存本机'; }

  welcome = !localStorage.getItem(LS_DATA) && !cfg.token;

  applyRoute(true);
  if (cfg.token) syncNow();

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function(){});
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}

boot();

})();
</script>
